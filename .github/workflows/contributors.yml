name: Update Contributors Information

on:
  workflow_dispatch: {}
  schedule:
    # Runs on the first day of the month at 5:30AM UTC
    - cron: '30 5 1 * *'

jobs:
  update-contributors:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # - name: Update contributor list
      #   id: contrib_list
      #   uses: akhilmhdh/contributors-readme-action@v2.3.10
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   with:
      #     readme_path: COMMUNITY.md
      #     use_username: false
      #     commit_message: 'update contributors information'

      - name: Get contributors count
        id: get_contributors
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          OWNER=$(echo $GITHUB_REPOSITORY | cut -d'/' -f1)
          REPO=$(echo $GITHUB_REPOSITORY | cut -d'/' -f2)
          QUERY='query { repository(owner: \"'"$OWNER"'\", name: \"'"$REPO"'\") { collaborators { totalCount } } }'

          CONTRIBUTORS=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$OWNER/$REPO/contributors?per_page=100" | \
            jq '[.[] | select(.type != "Bot" and (.login | test("\\[bot\\]$") | not) and (.login | test("-bot$") | not))] | length')

          echo "Total contributors: $CONTRIBUTORS"
          echo "contributors=$CONTRIBUTORS" >> $GITHUB_OUTPUT

      - name: Update COMMUNITY.md
        run: |
          CONTRIBUTORS="${{ steps.get_contributors.outputs.contributors }}"

          perl -i -pe 's/(<!--CONTRIBUTOR COUNT START-->).*?(<!--CONTRIBUTOR COUNT END-->)/$1 '"$CONTRIBUTORS"' $2/' COMMUNITY.md

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "update contributors information"
          branch: update-contributors-${{ github.run_number }}
          title: "[automated] Update Contributors Information"
          body: |
            Monthly automated update of contributors information in COMMUNITY.md.
          base: master
          delete-branch: true
