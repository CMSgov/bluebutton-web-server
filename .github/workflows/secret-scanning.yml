name: Scan for secrets

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch betterleaks
        run: |
          curl -o betterleaks.tar.gz https://github.com/betterleaks/betterleaks/releases/download/v1.8.1/betterleaks_1.8.1_linux_x64.tar.gz
          tar -xzf betterleaks.tar.gz
          chmod +x betterleaks
          sudo mv betterleaks /usr/local/bin/.

      - name: Scan for secrets
        run: |
          betterleaks git --exit-code 1
